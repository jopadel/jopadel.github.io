<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Jadwal lapangan Jo Padel (Jo Bawah & Jo Atas): lihat slot kosong dan sesi main bareng.">
<title>Jo Padel · Jadwal Lapangan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: panel lapangan malam di atas (hero), strip tanggal 14 hari, lalu grid jam × lapangan. Lembar bawah untuk detail & edit. */
:root{
  --bg:#edf2f5; --surface:#ffffff; --surface-2:#f5f8fa; --line:#d5dfe6; --fg:#0f2233; --muted:#5d7182;
  --court:#1d5b98; --court-ink:#ffffff; --court-soft:#dce8f4;
  --night:#0c2238; --night-2:#123150; --night-line:rgba(255,255,255,.22); --night-fg:#eef5fb; --night-muted:#9fb7cc;
  --ball:#d6e637; --ball-ink:#283000;
  --free:#1f8a55; --free-soft:#e3f4ea;
  --closed:#8a97a3; --danger:#b3261e;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --court-lines:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20204%20104%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%2829%2C91%2C152%2C0.09%29%27%20stroke-width%3D%270.7%27%3E%3Crect%20x%3D%272%27%20y%3D%272%27%20width%3D%27200%27%20height%3D%27100%27%20rx%3D%272%27/%3E%3Cline%20x1%3D%27102%27%20y1%3D%272%27%20x2%3D%27102%27%20y2%3D%27102%27%20stroke-width%3D%271.2%27/%3E%3Cline%20x1%3D%2732.5%27%20y1%3D%272%27%20x2%3D%2732.5%27%20y2%3D%27102%27/%3E%3Cline%20x1%3D%27171.5%27%20y1%3D%272%27%20x2%3D%27171.5%27%20y2%3D%27102%27/%3E%3Cline%20x1%3D%2732.5%27%20y1%3D%2752%27%20x2%3D%27171.5%27%20y2%3D%2752%27/%3E%3C/g%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%2829%2C91%2C152%2C0.09%29%27%20stroke-width%3D%271.8%27%3E%3Cpath%20d%3D%27M2%2022V2h40M162%202h40v20M2%2082v20h40M162%20102h40V82%27/%3E%3C/g%3E%3C/svg%3E");
  --glow-a:rgba(29,91,152,.16); --glow-b:rgba(214,230,55,.20); --turf:rgba(29,91,152,.025);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131d; --surface:#0f1e2b; --surface-2:#132635; --line:#213a4f; --fg:#e4eef6; --muted:#8fa6ba;
  --court:#5c9ee3; --court-ink:#06121c; --court-soft:#16304a;
  --night:#0b2036; --night-2:#112d49; --night-line:rgba(255,255,255,.18); --night-fg:#eef5fb; --night-muted:#9fb7cc;
  --free:#5cd193; --free-soft:#10291d; --closed:#6b7b89; --danger:#f2867e; --court-lines:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20204%20104%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28170%2C205%2C240%2C0.07%29%27%20stroke-width%3D%270.7%27%3E%3Crect%20x%3D%272%27%20y%3D%272%27%20width%3D%27200%27%20height%3D%27100%27%20rx%3D%272%27/%3E%3Cline%20x1%3D%27102%27%20y1%3D%272%27%20x2%3D%27102%27%20y2%3D%27102%27%20stroke-width%3D%271.2%27/%3E%3Cline%20x1%3D%2732.5%27%20y1%3D%272%27%20x2%3D%2732.5%27%20y2%3D%27102%27/%3E%3Cline%20x1%3D%27171.5%27%20y1%3D%272%27%20x2%3D%27171.5%27%20y2%3D%27102%27/%3E%3Cline%20x1%3D%2732.5%27%20y1%3D%2752%27%20x2%3D%27171.5%27%20y2%3D%2752%27/%3E%3C/g%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28170%2C205%2C240%2C0.07%29%27%20stroke-width%3D%271.8%27%3E%3Cpath%20d%3D%27M2%2022V2h40M162%202h40v20M2%2082v20h40M162%20102h40V82%27/%3E%3C/g%3E%3C/svg%3E"); --glow-a:rgba(92,158,227,.16); --glow-b:rgba(214,230,55,.07); --turf:rgba(255,255,255,.018); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08131d; --surface:#0f1e2b; --surface-2:#132635; --line:#213a4f; --fg:#e4eef6; --muted:#8fa6ba;
  --court:#5c9ee3; --court-ink:#06121c; --court-soft:#16304a;
  --night:#0b2036; --night-2:#112d49; --night-line:rgba(255,255,255,.18); --night-fg:#eef5fb; --night-muted:#9fb7cc;
  --free:#5cd193; --free-soft:#10291d; --closed:#6b7b89; --danger:#f2867e; --court-lines:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20204%20104%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28170%2C205%2C240%2C0.07%29%27%20stroke-width%3D%270.7%27%3E%3Crect%20x%3D%272%27%20y%3D%272%27%20width%3D%27200%27%20height%3D%27100%27%20rx%3D%272%27/%3E%3Cline%20x1%3D%27102%27%20y1%3D%272%27%20x2%3D%27102%27%20y2%3D%27102%27%20stroke-width%3D%271.2%27/%3E%3Cline%20x1%3D%2732.5%27%20y1%3D%272%27%20x2%3D%2732.5%27%20y2%3D%27102%27/%3E%3Cline%20x1%3D%27171.5%27%20y1%3D%272%27%20x2%3D%27171.5%27%20y2%3D%27102%27/%3E%3Cline%20x1%3D%2732.5%27%20y1%3D%2752%27%20x2%3D%27171.5%27%20y2%3D%2752%27/%3E%3C/g%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28170%2C205%2C240%2C0.07%29%27%20stroke-width%3D%271.8%27%3E%3Cpath%20d%3D%27M2%2022V2h40M162%202h40v20M2%2082v20h40M162%20102h40V82%27/%3E%3C/g%3E%3C/svg%3E"); --glow-a:rgba(92,158,227,.16); --glow-b:rgba(214,230,55,.07); --turf:rgba(255,255,255,.018); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body{isolation:isolate;min-height:100vh}
/* Latar: belang rumput sintetis, garis lapangan samar, cahaya lampu lapangan */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 45vmax at 100% -5%,var(--glow-a),transparent 70%),
    radial-gradient(45vmax 35vmax at -10% 105%,var(--glow-b),transparent 70%),
    var(--court-lines) center 58%/min(1150px,175vw) auto no-repeat,
    repeating-linear-gradient(180deg,var(--turf) 0 64px,transparent 64px 128px),
    var(--bg)}
.board-wrap,.site,.date,.cbar,.cust,.hsum div,.vtabs{box-shadow:0 1px 2px rgba(10,30,50,.05),0 8px 24px -12px rgba(10,30,50,.18)}
button{font:inherit;color:inherit}
#app{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:flex;flex-direction:column;gap:20px}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(160deg,var(--night-2),var(--night) 60%);color:var(--night-fg);padding:22px 22px 20px;display:flex;flex-direction:column;gap:18px}
.hero svg.lines{position:absolute;right:-30px;top:-20px;width:320px;height:auto;opacity:.9;pointer-events:none}
.hero svg.lines rect,.hero svg.lines line{fill:none;stroke:var(--night-line);stroke-width:2}
.hero svg.lines .glass{stroke:rgba(255,255,255,.35);stroke-width:5}
.hero svg.lines circle{fill:var(--ball)}
.hero-top{position:relative;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ball)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,3.6rem);line-height:.92;margin:6px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hours-tag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:.85rem;color:var(--night-muted)}
.hours-tag b{white-space:nowrap;color:var(--night-fg);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 4px rgba(214,230,55,.18)}
.hero-stats{position:relative;display:flex;gap:16px 28px;flex-wrap:wrap;align-items:flex-end}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:3rem;line-height:.9;font-variant-numeric:tabular-nums}
.stat b.free{color:var(--ball)}
.stat span{font-size:.8rem;color:var(--night-muted)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{border:1px solid var(--night-line);background:rgba(255,255,255,.06);color:var(--night-fg);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtn.ball{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}

/* Date strip */
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:thin}
.date{flex:none;scroll-snap-align:start;width:68px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.date .dw{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.date .dn{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.date .dm{font-size:.7rem;color:var(--muted)}
.date .df{margin-top:4px;font-size:.68rem;font-weight:700;color:var(--free);background:var(--free-soft);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.date .df.none{color:var(--muted);background:var(--surface-2)}
.date.on{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.date.on .dw,.date.on .dm{color:var(--court-ink);opacity:.8}
.date.on .df{background:var(--ball);color:var(--ball-ink)}

/* Board */
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.board-head h2{font-family:var(--display);font-size:1.7rem;font-weight:800;text-transform:uppercase;margin:0;letter-spacing:.02em}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.legend .lf{background:var(--free-soft);border:1.5px dashed var(--free)}
.legend .lb{background:var(--court)}
.legend .lm{background:var(--ball)}
.legend .lc{background:repeating-linear-gradient(45deg,var(--line) 0 3px,var(--surface-2) 3px 7px)}
.board-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.board{display:grid;gap:4px;padding:8px;min-width:min-content}
.court-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--surface);padding:6px 4px 8px;font-family:var(--display);font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;text-align:center;border-bottom:2px solid var(--fg)}
.hr{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums;padding:6px 4px 0 2px;text-align:right}
.hr.now{color:var(--court)}
.cell{border-radius:9px;min-height:50px;border:1.5px dashed transparent;padding:6px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;transition:transform .12s ease}
.cell.free{background:var(--free-soft);border-color:color-mix(in srgb,var(--free) 45%,transparent);color:var(--free)}
.cell.free .t{font-weight:700;font-size:.82rem}
.cell.free .s{font-size:.72rem;opacity:.8}
.cell.free:hover{border-style:solid}
.cell.past{background:var(--surface-2);color:var(--muted);border-color:transparent;cursor:default;font-size:.75rem}
.cell.blk{border:none;justify-content:flex-start;padding:9px 11px;gap:3px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.cell.blk .k{font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cell.blk .n{font-weight:700;font-size:.92rem;line-height:1.2;overflow-wrap:anywhere}
.cell.blk .s{font-size:.75rem;opacity:.85;font-variant-numeric:tabular-nums}
.cell.booked{background:var(--court);color:var(--court-ink)}
.cell.mabar{background:var(--ball);color:var(--ball-ink)}
.cell.closed{background:repeating-linear-gradient(45deg,var(--line) 0 4px,var(--surface-2) 4px 10px);color:var(--muted)}
.cell.ex{outline:2px dashed var(--danger);outline-offset:-3px}
.pips{display:flex;gap:4px;margin-top:3px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--ball-ink)}
.pip.o{background:transparent;border:1.5px solid var(--ball-ink)}
@media (prefers-reduced-motion:no-preference){.cell:not(.past):hover{transform:translateY(-1px)}}

.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.site{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.site b{font-family:var(--display);font-weight:800;font-size:1.4rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.site span{font-size:.78rem;color:var(--muted)}
.site.on{border-color:var(--court);background:var(--court-soft);box-shadow:inset 0 -3px 0 var(--court)}
.past-tog{width:100%;margin:10px 0 0;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px;font-weight:600;font-size:.85rem;cursor:pointer}
.past-tog:hover{color:var(--fg)}
.admin-note{font-size:.82rem;color:var(--muted);text-align:center}
.admin-note b{color:var(--court)}
.ex-note{font-size:.82rem;color:var(--danger);text-align:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,14,22,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-family:var(--display);font-weight:800;font-size:1.7rem;text-transform:uppercase;margin:0;line-height:1}
.sheet .when{color:var(--muted);font-size:.9rem;margin-top:4px}
.sheet .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
.sheet .wide{grid-column:1/-1}
.sheet input,.sheet select,.sheet textarea{font:400 .95rem var(--body);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.sheet textarea{min-height:60px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px;font-weight:700;cursor:pointer}
.seg button.on[data-v="booked"]{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.seg button.on[data-v="mabar"]{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.seg button.on[data-v="closed"]{background:var(--closed);border-color:var(--closed);color:var(--surface)}
.hint{font-weight:400}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.danger{color:var(--danger);margin-right:auto}
.btn[disabled]{opacity:.55;cursor:wait}
.err{color:var(--danger);font-size:.86rem;margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.facts div{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.facts span{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.facts b{font-size:1rem}
.players{display:flex;gap:6px;flex-wrap:wrap}
.pl{padding:4px 10px;border-radius:999px;background:var(--court-soft);font-size:.85rem}
.pl.o{background:transparent;border:1.5px dashed var(--free);color:var(--free)}
.contact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.contact code{font:600 1rem var(--body);user-select:all;flex:1}
.msg{font-size:.88rem;background:var(--surface-2);border-radius:10px;padding:10px 12px;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:520px){.sheet .grid{grid-template-columns:1fr}.hero svg.lines{width:220px;right:-50px}.stat b{font-size:2.4rem}}

/* Tabs & riwayat */
.vtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.vtabs button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.vtabs button.on{background:var(--court);color:var(--court-ink)}
.pb{align-self:flex-start;margin-top:3px;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--danger)}
.pb-paid{color:var(--free)}
.pb-free{color:var(--ball-ink);background:var(--ball)}
.modebar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px;font-size:.82rem;color:var(--muted)}
.modebar>span{font-weight:700;color:var(--fg)}
.modebar small{font-size:.76rem}
.pseg.mode button.on{background:var(--court);color:var(--court-ink)}
.hist{display:flex;flex-direction:column;gap:14px}
.hsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hsum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.hsum b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.hsum span{font-size:.75rem;color:var(--muted)}
.hsum .due b{color:var(--danger)}
.hrule{margin:0;font-size:.85rem;color:var(--muted)}
.hrule b{color:var(--fg)}
.htools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.htools input{flex:1;min-width:160px;font:400 .95rem var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip2{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip2.on{border-color:var(--court);color:var(--court);background:var(--court-soft)}
.hlist{display:flex;flex-direction:column;gap:8px}
.cust{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.cust[open]{border-color:var(--court)}
.cust summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:14px 16px;align-items:center}
.cust summary::-webkit-details-marker{display:none}
.cn{min-width:0;display:flex;flex-direction:column}
.cn b{font-size:1.05rem;overflow-wrap:anywhere}
.cn span{font-size:.8rem;color:var(--muted)}

n 1"}, {"id": "c2", "name": "Lapangan 2"}]}, {"id": "atas", "name": "Jo Atas", "courts": [{"id": "c3", "name": "Lapangan 1"}]}], "promoEvery": 10, "promoFree": 1, "siteUrl": "https://jopadel.github.io"}</script>
<script id="app-script">
(function(){
  var S = JSON.parse(document.getElementById('state').textContent);
  var app = document.getElementById('app');
  var showPast=false, isAdmin=false, art=null, saving=false, sheet=null, err='', confirmDel=false;
  var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'], HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var TYPE={booked:'Booking',mabar:'Main bareng',closed:'Tutup'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function pad(n){return (n<10?'0':'')+n;}
  function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function today(){return ds(new Date());}
  function hh(h){return pad(h)+'.00';}
  function fmtDay(s){var d=pd(s);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()];}
  var sel=today(), selSite=S.sites[0].id;
  var _pp=null; try{_pp=sessionStorage.getItem('padel-pay');}catch(e){}
  try{var ms=sessionStorage.getItem('padel-site'); if(ms && S.sites.some(function(x){return x.id===ms;})) selSite=ms;}catch(e){}
  try{var m=sessionStorage.getItem('padel-sel'); if(m && m>=today()) sel=m;}catch(e){}

  function allCourts(){var o=[];S.sites.forEach(function(st){st.courts.forEach(function(c){o.push({id:c.id,name:c.name,site:st.id,siteName:st.name});});});return o;}
  function site(){return S.sites.filter(function(x){return x.id===selSite;})[0]||S.sites[0];}
  function waNum(t){var d=String(t||'').replace(/\D/g,''); if(d[0]==='0') d='62'+d.slice(1); return d.length>=10&&d.length<=15?d:'';}
  function waBtn(contact,msg,label){var n=waNum(contact); return n?'<a class="btn wa-btn" href="https://wa.me/'+n+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">'+(label||'Chat WhatsApp')+'</a>':'';}
  function siteBar(){if(!isAdmin||!S.siteUrl) return ''; var u=S.siteUrl; return '<div class="sbar"><div><span>Link website untuk dibagikan</span><b>'+esc(u.replace(/^https?:\/\//,''))+'</b></div><div class="sbtns"><button class="btn primary" data-act="copy" data-t="'+esc(u)+'">Salin link</button><a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Buka</a></div></div>';}
  function contactBar(){if(!S.contact) return ''; var msg='Halo, saya mau booking lapangan di '+(S.title||'Jo Padel')+'.'; return '<div class="cbar"><div><span>Mau booking?</span><b>'+esc(S.contact)+'</b></div>'+waBtn(S.contact,msg)+'</div>';}
  function courtIds(){return allCourts().map(function(c){return c.id;});}
  function dayBookings(date){var ids=courtIds();return S.bookings.filter(function(b){return b.date===date && ids.indexOf(b.court)>=0;});}
  function nowHour(){return new Date().getHours();}
  function isPastHour(date,h){var t=today(); if(date<t) return true; if(date>t) return false; return h<nowHour();}
  function freeHours(date,courts){
    var n=0, bs=dayBookings(date);
    (courts||allCourts()).forEach(function(c){
      for(var h=S.open;h<S.close;h++){
        if(isPastHour(date,h)) continue;
        var taken=bs.some(function(b){return b.court===c.id && h>=b.start && h<b.end;});
        if(!taken) n++;
      }
    });
    return n;
  }
  function days(){var out=[],d=pd(today());for(var i=0;i<14;i++){out.push(ds(d));d.setDate(d.getDate()+1);}if(out.indexOf(sel)<0)out.unshift(sel);return out;}

  function heroHTML(){
    var t=today(), free=freeHours(t), mabarOpen=0;
    dayBookings(t).forEach(function(b){ if(b.type==='mabar' && b.capacity && b.end>nowHour()) mabarOpen+=Math.max(0,b.capacity-(b.players||[]).length); });
    var nd=pd(t);
    return '<section class="hero"><svg class="lines" viewBox="0 0 220 140" aria-hidden="true"><rect x="10" y="10" width="200" height="120" rx="3"/><rect class="glass" x="10" y="10" width="200" height="120" rx="3" stroke-dasharray="40 160 40 400"/><line x1="110" y1="10" x2="110" y2="130"/><line x1="40" y1="10" x2="40" y2="130"/><line x1="180" y1="10" x2="180" y2="130"/><line x1="40" y1="70" x2="180" y2="70"/><circle cx="148" cy="44" r="6"/></svg>'+
      '<div class="hero-top"><div><div class="eyebrow">'+esc(HARI[nd.getDay()]+', '+nd.getDate()+' '+BULAN[nd.getMonth()]+' '+nd.getFullYear())+'</div>'+
      '<h1>'+esc(S.title||'Jadwal Padel')+'</h1><div class="hours-tag"><span class="dot"></span><span>Buka <b>'+hh(S.open)+' – '+hh(S.close)+'</b></span><span>'+esc(S.sites.map(function(x){return x.name+' ('+x.courts.length+' lap.)';}).join(' · '))+'</span></div></div>'+
      (isAdmin?'<div class="hero-actions"><button class="hbtn ball" data-act="new">+ Tambah jadwal</button><button class="hbtn" data-act="settings">Pengaturan</button></div>':'')+'</div>'+
      '<div class="hero-stats">'+S.sites.map(function(x){return '<div class="stat"><b class="free">'+freeHours(t,x.courts)+'</b><span>kosong hari ini<br>'+esc(x.name)+'</span></div>';}).join('')+
      (mabarOpen?'<div class="stat"><b>'+mabarOpen+'</b><span>kursi mabar kosong</span></div>':'')+'</div></section>';
  }

  function datesHTML(){
    return '<nav class="dates" aria-label="Pilih tanggal">'+days().map(function(d){
      var dt=pd(d), f=freeHours(d,site().courts);
      return '<button class="date'+(d===sel?' on':'')+'" data-act="day" data-d="'+d+'" aria-pressed="'+(d===sel)+'"><span class="dw">'+(d===today()?'Hari ini':HR[dt.getDay()])+'</span><span class="dn">'+dt.getDate()+'</span><span class="dm">'+BULAN[dt.getMonth()].slice(0,3)+'</span><span class="df'+(f?'':' none')+'">'+(f?f+' kosong':'penuh')+'</span></button>';
    }).join('')+'</nav>';
  }

  function boardHTML(){
    var CS=site().courts, bs=dayBookings(sel), nc=CS.length, isT=sel===today(), F=(isT&&!showPast)?Math.min(Math.max(S.open,nowHour()),S.close-1):S.open, rows=S.close-F, hid=isT?Math.max(0,F-S.open):0;
    var h='<div class="sites" role="tablist">'+S.sites.map(function(x){return '<button role="tab" class="site'+(x.id===site().id?' on':'')+'" data-act="site" data-s="'+esc(x.id)+'" aria-selected="'+(x.id===site().id)+'"><b>'+esc(x.name)+'</b><span>'+x.courts.length+' lapangan · '+freeHours(sel,x.courts)+' slot kosong</span></button>';}).join('')+'</div>';
    if(isAdmin) h+='<div class="modebar"><span>Tampilan jadwal</span><div class="pseg mode" role="group" aria-label="Tampilan jadwal"><button type="button" class="'+(!showPay?'on ':'')+'m-pub" data-act="mode" data-v="pub">Umum</button><button type="button" class="'+(showPay?'on ':'')+'m-pay" data-act="mode" data-v="pay">Dengan status bayar</button></div><small>'+(showPay?'Label bayar hanya terlihat oleh kamu.':'Sama seperti yang dilihat pengunjung.')+'</small></div>';
    h+='<div class="board-head"><h2>'+esc(fmtDay(sel))+'</h2><div class="legend"><span><i class="lf"></i>Kosong</span><span><i class="lb"></i>Booking</span><span><i class="lm"></i>Main bareng</span><span><i class="lc"></i>Tutup</span></div></div>'+((hid||showPast)&&isT&&nowHour()>S.open?'<button class="past-tog" data-act="past">'+(showPast?'Sembunyikan jam yang sudah lewat':'Tampilkan '+hid+' jam yang sudah lewat')+'</button>':'');
    h+='<div class="board-wrap"><div class="board" style="grid-template-columns:52px repeat('+nc+',minmax(130px,1fr));grid-template-rows:auto repeat('+rows+',minmax(52px,auto))">';
    h+='<div class="court-h" style="grid-row:1;grid-column:1"></div>';
    CS.forEach(function(c,i){h+='<div class="court-h" style="grid-row:1;grid-column:'+(i+2)+'">'+esc(c.name)+'</div>';});
    var isToday=sel===today(), nh=nowHour();
    for(var hr=F;hr<S.close;hr++) h+='<div class="hr'+(isToday&&hr===nh?' now':'')+'" style="grid-row:'+(hr-F+2)+';grid-column:1">'+hh(hr)+'</div>';
    CS.forEach(function(c,i){
      var col=i+2, covered={};
      bs.filter(function(b){return b.court===c.id;}).sort(function(a,b){return a.start-b.start;}).forEach(function(b){
        var s=Math.max(b.start,F), e=Math.min(b.end,S.close); if(e<=s) return;
        for(var k=s;k<e;k++) covered[k]=1;
        var cap=+b.capacity||0, n=(b.players||[]).length, sub='';
        if(b.type==='mabar' && cap){ sub=(b.host||b.price?'<span class="s">'+[b.host?'oleh '+esc(b.host):'',b.price?esc(b.price):''].filter(Boolean).join(' · ')+'</span>':'')+'<span class="s">'+n+'/'+cap+' pemain'+(cap>n?' · '+(cap-n)+' tempat lagi':' · penuh')+'</span><span class="pips">'; for(var p=0;p<cap&&p<8;p++) sub+='<span class="pip'+(p<n?'':' o')+'"></span>'; sub+='</span>'; }
        else sub='<span class="s">'+hh(b.start)+' – '+hh(b.end)+'</span>';
        h+='<button class="cell blk '+b.type+(b.example?' ex':'')+'" data-act="open" data-id="'+esc(b.id)+'" style="grid-row:'+(s-F+2)+' / span '+(e-s)+';grid-column:'+col+'"><span class="k">'+TYPE[b.type]+(b.example?' · contoh':'')+'</span><span class="n">'+esc(b.label||TYPE[b.type])+'</span>'+sub+(b.type!=='closed'?payBadge(b.id):'')+'</button>';
      });
      for(var hr2=F;hr2<S.close;hr2++){
        if(covered[hr2]) continue;
        var pos='grid-row:'+(hr2-F+2)+';grid-column:'+col;
        if(isPastHour(sel,hr2)) h+='<div class="cell past" style="'+pos+'">Lewat</div>';
        else h+='<button class="cell free" data-act="free" data-c="'+c.id+'" data-h="'+hr2+'" style="'+pos+'"><span class="t">Kosong</span><span class="s">'+hh(hr2)+' – '+hh(hr2+1)+'</span></button>';
      }
    });
    h+='</div></div>';
    return h;
  }


  /* ---- Riwayat & pembayaran (khusus admin, status bayar disimpan privat) ---- */
  var MEM={}, LINK={}, memReady=false, linkReady=false;
  var view='board', showPay=(_pp!=='0'), db=null, PAY={}, payReady=false, payBusy={}, openP={}, hq='', hf='all', pendingRender=false;
  var PAYL={unpaid:'Belum bayar',paid:'Lunas',free:'Gratis (promo)'};
  function payOf(id){return PAY[id]||'unpaid';}
  function normWA(v){var d=String(v||'').replace(/\D/g,''); if(!d) return ''; if(d.indexOf('62')===0) d=d; else if(d[0]==='0') d='62'+d.slice(1); else if(d[0]==='8') d='62'+d; return (d.length>=10&&d.length<=15)?d:null;}
  function fmtWA(d){if(!d) return ''; var l='0'+d.slice(2); return l.slice(0,4)+'-'+l.slice(4,8)+(l.length>8?'-'+l.slice(8):'');}
  function snapRender(){ if(sheet&&(sheet.kind==='settings'||sheet.kind==='member')){pendingRender=true;return;} if(sheet&&sheet.kind==='edit') readEditor(); render(); }
  function memberSheet(ph){var m=ph&&MEM[ph]; return {kind:'member',data:{orig:ph||'',name:m?m.name:'',phone:ph?fmtWA(ph):''}};}
  function custKey(n){return String(n||'').trim().toLowerCase().replace(/\s+/g,' ');}
  function custName(b){return b.type==='mabar'?(b.host||b.label):b.label;}
  function promoEvery(){return +S.promoEvery||10;}
  function promoFree(){return +S.promoFree||1;}
  function customers(){
    var map={};
    S.bookings.forEach(function(b){
      if(b.type==='closed'||b.example) return;
      var nm=custName(b), ph=LINK[b.id], k=ph?'p:'+ph:'n:'+custKey(nm); if(!ph&&!custKey(nm)) return;
      var c=map[k]||(map[k]={key:k,phone:ph||'',name:(ph&&MEM[ph]&&MEM[ph].name)||nm.trim(),list:[],hours:0,count:0,unpaid:0,usedFree:0,last:''});
      var hrs=Math.max(0,b.end-b.start), st=payOf(b.id);
      c.list.push(b); c.hours+=hrs;
      if(st==='free') c.usedFree+=hrs; else c.count+=hrs;
      if(st==='unpaid') c.unpaid+=hrs;
      if((b.date+pad(b.start))>c.last){c.last=b.date+pad(b.start);if(!(ph&&MEM[ph]&&MEM[ph].name))c.name=nm.trim();}
    });
    Object.keys(MEM).forEach(function(ph){var k='p:'+ph; if(!map[k]) map[k]={key:k,phone:ph,name:MEM[ph].name||fmtWA(ph),list:[],hours:0,count:0,unpaid:0,usedFree:0,last:''};});
    return Object.keys(map).map(function(k){var c=map[k];
      c.earned=Math.floor(c.count/promoEvery())*promoFree(); c.avail=Math.max(0,c.earned-c.usedFree); c.prog=c.count%promoEvery();
      c.list.sort(function(a,b){return (b.date+pad(b.start)).localeCompare(a.date+pad(a.start));}); return c;})
      .sort(function(a,b){return b.hours-a.hours||a.name.localeCompare(b.name);});
  }
  function payBadge(id){if(!isAdmin||!payReady||!showPay) return '';var st=payOf(id);return '<span class="pb pb-'+st+'">'+(st==='paid'?'Lunas':st==='free'?'Gratis':'Belum bayar')+'</span>';}
  function paySeg(id){var st=payOf(id);return '<div class="pseg" role="group" aria-label="Status bayar">'+['unpaid','paid','free'].map(function(v){return '<button type="button" class="'+(st===v?'on ':'')+'p-'+v+'" data-act="pay" data-id="'+esc(id)+'" data-v="'+v+'"'+(payBusy[id]?' disabled':'')+'>'+(v==='unpaid'?'Belum':v==='paid'?'Lunas':'Gratis')+'</button>';}).join('')+'</div>';}
  function histListHTML(){
    var cs=customers(), q=custKey(hq);
    var list=cs.filter(function(c){
      if(q && custKey(c.name).indexOf(q)<0 && (c.phone+' '+fmtWA(c.phone)).indexOf(q.replace(/^0/,''))<0) return false;
      if(hf==='unpaid') return c.unpaid>0;
      if(hf==='free') return c.avail>0;
      if(hf==='nowa') return !c.phone;
      return true;});
    if(!cs.length) return '<div class="hempty"><b>Belum ada riwayat</b>Setiap booking dan main bareng yang kamu tambahkan akan tercatat di sini, dikelompokkan per nomor WA.</div>';
    if(!list.length) return '<div class="hempty">Tidak ada yang cocok dengan pencarian atau filter ini.</div>';

  function linkGroup(key,raw){
    if(!db||memBusy) return; var ph=normWA(raw);
    if(!ph){toast('Nomor WA tidak valid. Contoh: 0812-3456-7890');return;}
    var c=customers().filter(function(x){return x.key===key;})[0]; if(!c) return;
    var tasks=[]; if(!MEM[ph]) tasks.push(function(){return db.collection('members').doc(ph).set({name:c.name,phone:ph,at:new Date().toISOString()});});
    c.list.forEach(function(b){tasks.push(function(){return db.collection('links').doc(b.id).set({phone:ph});});});
    memBusy=true; toast('Menyimpan…');
    chain(tasks).then(function(){memBusy=false; if(!MEM[ph]) MEM[ph]={name:c.name}; c.list.forEach(function(b){LINK[b.id]=ph;}); delete openP[key]; openP['p:'+ph]=1; toast(MEM[ph]&&MEM[ph].name!==c.name?'Digabung ke member '+MEM[ph].name:'Nomor WA tersimpan'); render();})

  function saveMember(){
    var x=sheet.data, nm=val('m-name'), raw=val('m-phone'), ph=normWA(raw);

    if(ph!==x.orig && MEM[ph]){err='Nomor ini sudah dipakai member '+MEM[ph].name+'.';render();return;}
    var tasks=[function(){return db.collection('members').doc(ph).set({name:nm,phone:ph,at:new Date().toISOString()});}];
    if(x.orig && ph!==x.orig){
      Object.keys(LINK).forEach(function(bid){ if(LINK[bid]===x.orig) tasks.push(function(){return db.collection('links').doc(bid).set({phone:ph});}); });
      tasks.push(function(){return db.collection('members').doc(x.orig).delete();});

  function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}

  function buildDoc(){
    var json=JSON.stringify(S).replace(/</g,'\\u003c');
    var hs=(document.head.querySelector('style')||{textContent:''}).textContent;
    var parts=[document.body.querySelector('title'),document.body.querySelector('link[rel=stylesheet]'),document.body.querySelector('style')].filter(Boolean).map(function(e){return e.outerHTML;}).join('');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+hs+'</style></head><body>'+parts+
      '<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n'+document.getElementById('app-script').outerHTML+'</body></html>';
  }

  function save(next,okMsg){
    if(!art){toast('Tampilan ini hanya bisa melihat jadwal.');return;}
    var prev=S; S=next; saving=true; render();
    art.publish(buildDoc()).then(function(){saving=false;sheet=null;confirmDel=false;err='';toast(okMsg||'Tersimpan');render();})
    .catch(function(e){
      saving=false; S=prev; var c=e&&e.code;
      if(c==='conflict'){toast('Jadwal baru saja diubah, memuat versi terbaru…');return;}
      if(c==='not_writer'||c==='not_granted'){isAdmin=false;sheet=null;toast('Tampilan ini hanya bisa melihat jadwal.');render();return;}
      err=c==='rate_limited'?'Terlalu cepat. Tunggu sebentar lalu simpan lagi.':'Gagal menyimpan ('+(c||'error')+'). Coba lagi.';
      render();
    });
  }

  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var a=b.getAttribute('data-act');
    if(a==='scrim'){ if(e.target===b && !saving){sheet=null;err='';confirmDel=false;render();} return; }
    if(saving) return;
    if(a==='past'){showPast=!showPast;render();}
    else if(a==='view'){view=b.getAttribute('data-v');render();}
    else if(a==='mode'){showPay=b.getAttribute('data-v')==='pay';try{sessionStorage.setItem('padel-pay',showPay?'1':'0');}catch(_){}render();}
    else if(a==='hf'){hf=b.getAttribute('data-v');render();}
    else if(a==='mem-new'){sheet=memberSheet('');err='';render();}
    else if(a==='mem-edit'){sheet=memberSheet(b.getAttribute('data-p'));err='';render();}
    else if(a==='save-member'){saveMember();}
    else if(a==='link-group'){var k=b.getAttribute('data-k'), inp=document.getElementById('lk-'+k); linkGroup(k,inp?inp.value:'');}
    else if(a==='pay'){setPay(b.getAttribute('data-id'),b.getAttribute('data-v'));}
    else if(a==='site'){selSite=b.getAttribute('data-s');try{sessionStorage.setItem('padel-site',selSite);}catch(_){}render();}
    else if(a==='day'){sel=b.getAttribute('data-d');try{sessionStorage.setItem('padel-sel',sel);}catch(_){}render();}
    else if(a==='close'){sheet=null;err='';confirmDel=false;pendingRender=false;render();}
    else if(a==='free'){
      var c=b.getAttribute('data-c'), h=+b.getAttribute('data-h');
      if(isAdmin) sheet={kind:'edit',data:{type:'booked',label:'',date:sel,court:c,start:h,end:Math.min(h+1,S.close),players:[],capacity:4,note:''}};
      else sheet={kind:'free',data:{court:c,date:sel,h:h}};
      err='';render();
    }
    else if(a==='open'){
      var bk=S.bookings.filter(function(x){return x.id===b.getAttribute('data-id');})[0]; if(!bk) return;
      sheet={kind:isAdmin?'edit':'view',data:JSON.parse(JSON.stringify(bk))}; err='';confirmDel=false;render();
    }
    else if(a==='new'){sheet={kind:'edit',data:{type:'booked',label:'',date:sel,court:site().courts[0].id,start:Math.max(S.open,Math.min(S.close-1,19)),end:Math.min(S.close,Math.max(S.open+1,21)),players:[],capacity:4,note:''}};err='';render();}
    else if(a==='settings'){sheet={kind:'settings',data:{title:S.title,open:S.open,close:S.close,courts:S.sites.map(function(st){return st.name+': '+st.courts.map(function(c){return c.name;}).join(', ');}).join('\n'),contact:S.contact||'',promoEvery:promoEvery(),promoFree:promoFree()}};err='';render();}
    else if(a==='type'){readEditor();sheet.data.type=b.getAttribute('data-v');render();}
    else if(a==='copy'){
      var t=b.getAttribute('data-t');
      try{navigator.clipboard.writeText(t).then(function(){toast('Disalin');},function(){toast('Tidak bisa menyalin otomatis. Tekan lama teksnya untuk menyalin.');});}catch(_){toast('Tekan lama teksnya untuk menyalin.');}
    }
    else if(a==='del'){confirmDel=true;readEditor();render();}
    else if(a==='del-no'){confirmDel=false;readEditor();render();}
    else if(a==='del-yes'){var id=sheet.data.id,n=clone();n.bookings=n.bookings.filter(function(x){return x.id!==id;});save(n,'Jadwal dihapus');}
    else if(a==='save'){
      var x=readEditor();
      if(!x.date){err='Pilih tanggal dulu.';render();return;}
      if(x.end<=x.start){err='Jam selesai harus setelah jam mulai.';render();return;}
      var clash=S.bookings.filter(function(o){return o.id!==x.id && o.date===x.date && o.court===x.court && x.start<o.end && o.start<x.end;})[0];
      if(clash){err='Bentrok dengan "'+(clash.label||TYPE[clash.type])+'" ('+hh(clash.start)+' – '+hh(clash.end)+') di lapangan yang sama.';render();return;}
      var rec={id:x.id||nid('b'),date:x.date,court:x.court,start:x.start,end:x.end,type:x.type,label:x.label,
        players:x.type==='mabar'?(x.players||[]):[],capacity:x.type==='mabar'?(x.capacity||4):0,note:x.type==='closed'?'':(x.note||''),example:false};
      if(x.type==='mabar'){rec.host=x.host||'';rec.hostContact=x.hostContact||'';rec.price=x.price||'';}
      var n2=clone(),i=-1; n2.bookings.forEach(function(o,k){if(o.id===rec.id)i=k;});
      if(i>=0)n2.bookings[i]=rec; else n2.bookings.push(rec);
      sel=rec.date; S.sites.forEach(function(st){if(st.courts.some(function(c){return c.id===rec.court;}))selSite=st.id;});
      var ph=(x.phone!=null&&rec.type!=='closed')?normWA(x.phone):undefined;
      if(ph===null){err='Nomor WA tidak valid. Contoh: 0812-3456-7890, atau kosongkan.';render();return;}
      if(db && ph!==undefined){
        var tasks=[];
        if(ph){ if(!MEM[ph]) tasks.push(function(){return db.collection('members').doc(ph).set({name:custName(rec)||fmtWA(ph),phone:ph,at:new Date().toISOString()});});
          if(LINK[rec.id]!==ph) tasks.push(function(){return db.collection('links').doc(rec.id).set({phone:ph});}); }
        else if(LINK[rec.id]) tasks.push(function(){return db.collection('links').doc(rec.id).delete();});
        saving=true; render();
        chain(tasks).then(function(){saving=false; save(n2,'Jadwal disimpan');}).catch(function(e){saving=false; err='Nomor WA gagal disimpan ('+((e&&e.code)||'error')+').'; render();});
      } else save(n2,'Jadwal disimpan');
    }
    else if(a==='save-settings'){
      var op=+val('s-open'), cl=+val('s-close');
      var names=val('s-courts').split('\n').map(function(line){var i=line.indexOf(':');if(i<0)return null;var nm=line.slice(0,i).trim();var cs=line.slice(i+1).split(',').map(function(z){return z.trim();}).filter(Boolean).slice(0,8);return nm&&cs.length?{name:nm,courts:cs}:null;}).filter(Boolean).slice(0,6);
      if(cl<=op){err='Jam tutup harus setelah jam buka.';sheet.data={title:val('s-title'),open:op,close:cl,courts:val('s-courts'),contact:val('s-contact')};render();return;}
      if(!names.length){err='Isi minimal satu tempat dengan format "Nama tempat: Lapangan 1, Lapangan 2".';sheet.data={title:val('s-title'),open:op,close:cl,courts:val('s-courts'),contact:val('s-contact')};render();return;}
      var n3=clone(); n3.title=val('s-title')||'Jadwal Padel'; n3.open=op; n3.close=cl; n3.contact=val('s-contact'); n3.promoEvery=Math.max(1,Math.min(100,parseInt(val('s-pe'),10)||10)); n3.promoFree=Math.max(0,Math.min(20,parseInt(val('s-pf'),10)||0));
      n3.sites=names.map(function(sn,k){var old=S.sites.filter(function(o){return o.name===sn.name;})[0]||S.sites[k];return {id:(old&&old.id)||nid('s'),name:sn.name,courts:sn.courts.map(function(cn,j){var oc=old&&(old.courts.filter(function(o){return o.name===cn;})[0]||old.courts[j]);return {id:(oc&&oc.id)||nid('c'),name:cn};})};});
      if(!n3.sites.some(function(o){return o.id===selSite;})) selSite=n3.sites[0].id;
      save(n3,'Pengaturan disimpan');
    }
  });
  app.addEventListener('input',function(e){ if(e.target.id==='f-phone'){ var p=normWA(e.target.value), hn=document.getElementById('f-phone-hint'), lb=document.getElementById('f-label'), m=p&&MEM[p]; if(hn) hn.textContent=m?'Member: '+m.name:(p?'Member baru, akan dibuat saat disimpan':'Pilih dari daftar member atau ketik nomor baru'); if(m&&lb&&!lb.value&&sheet&&sheet.data.type==='booked') lb.value=m.name; return; }
    if(e.target.id==='h-q'){ hq=e.target.value; var l=document.getElementById('h-list'); if(l) l.innerHTML=histListHTML(); } });
  app.addEventListener('toggle',function(e){ var d=e.target; if(d.classList&&d.classList.contains('cust')){ var k=d.getAttribute('data-k'); if(d.open) openP[k]=1; else delete openP[k]; } },true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet&&!saving){sheet=null;err='';confirmDel=false;render();}});

  render();
  setInterval(function(){ if(!sheet) render(); },5*60*1000);
})();
</script>

</body>
</html>
